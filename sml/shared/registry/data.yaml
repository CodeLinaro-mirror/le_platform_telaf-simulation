#
# data domain registry -- source of truth for PA<->MPSS data-domain wire
# contract. Reverse-engineered from the hand-maintained
# pa/telaf-pa-simula/component/data/Topics.hpp (C++) and sml/mpss/topics.py
# (Python), which this registry supersedes (see Sim-Shared-Contract-and-
# CodeGen.md §10 cutover flow). Both files are deleted once PA/MPSS switch
# to the generated/ output of this registry.
#
# NOT included here (out of scope):
#   - request_profile (ap/req/data/request_profile, mp/rsp/data/request_profile):
#     declared in Topics.hpp but dead on the wire -- PA's requestProfile()
#     reuses kReqQueryProfile (see DataProfileManager.cpp's RequestProfile_Signal
#     handler comment). No registry entry for a topic nothing publishes to.
#   - TOPIC_IND_SUBSYS_READY_TEL (sml/mpss/data/evt/subsys/tel/1/ready):
#     phone/telephony placeholder unrelated to the data domain's contract,
#     predates this registry, kept as-is in topics.py.

domain: data

rpcs:
  # --- data.call.* — DataConnectionManager ----------------------------------

  - method: start_data_call
    req_topic: "ap/req/data/start_data_call"
    rsp_topic: "mp/rsp/data/start_data_call"
    req_payload: schemas/data/start_data_call_req.json
    rsp_payload: schemas/data/start_data_call_rsp.json
    qos: 1
    description: "Bring up a data call for a given profile."

  - method: stop_data_call
    req_topic: "ap/req/data/stop_data_call"
    rsp_topic: "mp/rsp/data/stop_data_call"
    req_payload: schemas/data/stop_data_call_req.json
    rsp_payload: schemas/data/stop_data_call_rsp.json
    qos: 1
    description: "Tear down an active data call for a given profile."

  - method: list_data_call
    req_topic: "ap/req/data/list_data_call"
    rsp_topic: "mp/rsp/data/list_data_call"
    req_payload: schemas/data/list_data_call_req.json
    rsp_payload: schemas/data/list_data_call_rsp.json
    qos: 1
    description: "List all non-terminal data call sessions."

  # --- data.profile.* — DataProfileManager ----------------------------------

  - method: query_profile
    req_topic: "ap/req/data/query_profile"
    rsp_topic: "mp/rsp/data/query_profile"
    req_payload: schemas/data/query_profile_req.json
    rsp_payload: schemas/data/query_profile_rsp.json
    qos: 1
    description: >-
      Look up profiles. Two real-SDK methods wire onto this one topic pair:
      requestProfile(profileId, techPref) sends {profileId, techPref} and
      gets back a single-element (or empty) `profiles` list; queryProfile
      (ProfileParams filter) sends a partial-field filter object and gets
      back all matches. Disambiguated server-side on presence of
      `profileId` in the request payload.

  - method: request_profile_list
    req_topic: "ap/req/data/request_profile_list"
    rsp_topic: "mp/rsp/data/request_profile_list"
    req_payload: schemas/data/request_profile_list_req.json
    rsp_payload: schemas/data/request_profile_list_rsp.json
    qos: 1
    description: "List every stored profile, unfiltered."

  - method: create_profile
    req_topic: "ap/req/data/create_profile"
    rsp_topic: "mp/rsp/data/create_profile"
    req_payload: schemas/data/create_profile_req.json
    rsp_payload: schemas/data/create_profile_rsp.json
    qos: 1
    description: "Create a new profile; the server assigns its id."

  - method: modify_profile
    req_topic: "ap/req/data/modify_profile"
    rsp_topic: "mp/rsp/data/modify_profile"
    req_payload: schemas/data/modify_profile_req.json
    rsp_payload: schemas/data/modify_profile_rsp.json
    qos: 1
    description: "Modify fields of an existing profile by id."

  - method: delete_profile
    req_topic: "ap/req/data/delete_profile"
    rsp_topic: "mp/rsp/data/delete_profile"
    req_payload: schemas/data/delete_profile_req.json
    rsp_payload: schemas/data/delete_profile_rsp.json
    qos: 1
    description: "Delete an existing profile by id."

  # --- data.serv.* — ServingSystemManager -----------------------------------

  - method: request_service_status
    req_topic: "ap/req/data/request_service_status"
    rsp_topic: "mp/rsp/data/request_service_status"
    req_payload: schemas/data/request_service_status_req.json
    rsp_payload: schemas/data/request_service_status_rsp.json
    qos: 1
    description: "Query current serving-system service state and RAT."

  - method: request_roaming_status
    req_topic: "ap/req/data/request_roaming_status"
    rsp_topic: "mp/rsp/data/request_roaming_status"
    req_payload: schemas/data/request_roaming_status_req.json
    rsp_payload: schemas/data/request_roaming_status_rsp.json
    qos: 1
    description: "Query current roaming status."

  - method: request_nr_icon_type
    req_topic: "ap/req/data/request_nr_icon_type"
    rsp_topic: "mp/rsp/data/request_nr_icon_type"
    req_payload: schemas/data/request_nr_icon_type_req.json
    rsp_payload: schemas/data/request_nr_icon_type_rsp.json
    qos: 1
    description: "Query current 5G NR icon type to display."

  - method: make_dormant
    req_topic: "ap/req/data/make_dormant"
    rsp_topic: "mp/rsp/data/make_dormant"
    req_payload: schemas/data/make_dormant_req.json
    rsp_payload: schemas/data/make_dormant_rsp.json
    qos: 1
    description: "Force the data connection dormant."

  - method: get_default_profile
    req_topic: "ap/req/data/get_default_profile"
    rsp_topic: "mp/rsp/data/get_default_profile"
    req_payload: schemas/data/get_default_profile_req.json
    rsp_payload: schemas/data/get_default_profile_rsp.json
    qos: 1
    description: "Query the current default profile id for an operation type."

  - method: set_default_profile
    req_topic: "ap/req/data/set_default_profile"
    rsp_topic: "mp/rsp/data/set_default_profile"
    req_payload: schemas/data/set_default_profile_req.json
    rsp_payload: schemas/data/set_default_profile_rsp.json
    qos: 1
    description: "Set the default profile id for an operation type; persists to data_profiles.json."

  - method: request_data_call_bitrate
    req_topic: "ap/req/data/request_data_call_bitrate"
    rsp_topic: "mp/rsp/data/request_data_call_bitrate"
    req_payload: schemas/data/request_data_call_bitrate_req.json
    rsp_payload: schemas/data/request_data_call_bitrate_rsp.json
    qos: 1
    description: "Query max Tx/Rx bit rate for the active call on a profile."

  - method: set_throughput_interval
    req_topic: "ap/req/data/set_throughput_interval"
    rsp_topic: "mp/rsp/data/set_throughput_interval"
    req_payload: schemas/data/set_throughput_interval_req.json
    rsp_payload: schemas/data/set_throughput_interval_rsp.json
    qos: 1
    description: "Set (or, intervalMs=0, disable) periodic throughput_info reporting."

  - method: request_throughput_info
    req_topic: "ap/req/data/request_throughput_info"
    rsp_topic: "mp/rsp/data/request_throughput_info"
    req_payload: schemas/data/request_throughput_info_req.json
    rsp_payload: schemas/data/request_throughput_info_rsp.json
    qos: 1
    description: "Query the last known throughput snapshot for every active call."

  - method: request_throttle_status
    req_topic: "ap/req/data/request_throttle_status"
    rsp_topic: "mp/rsp/data/request_throttle_status"
    req_payload: schemas/data/request_throttle_status_req.json
    rsp_payload: schemas/data/request_throttle_status_rsp.json
    qos: 1
    description: "Query APN throttle status for a profile."

indications:
  # --- data.call.* -----------------------------------------------------------

  - event: call_state
    ind_topic: "mp/ind/data/call_state"
    payload: schemas/data/call_state_ind.json
    qos: 1
    retain: false
    description: "Data call state transition (CONNECTING/CONNECTED/DISCONNECTING/NO_NET/IDLE)."

  - event: throughput_info
    ind_topic: "mp/ind/data/throughput_info"
    payload: schemas/data/throughput_info_ind.json
    qos: 1
    retain: false
    description: "Periodic throughput snapshot while reporting is enabled."

  - event: qos_status
    ind_topic: "mp/ind/data/qos_status"
    payload: schemas/data/qos_status_ind.json
    qos: 1
    retain: false
    description: "QoS flow state change (activated/modified/deactivated) for a profile."

  - event: hw_accel_state
    ind_topic: "mp/ind/data/hw_accel_state"
    payload: schemas/data/hw_accel_state_ind.json
    qos: 1
    retain: false
    description: "Hardware acceleration state change."

  - event: throttle_status
    ind_topic: "mp/ind/data/throttle_status"
    payload: schemas/data/throttle_status_ind.json
    qos: 1
    retain: false
    description: "APN throttle status change."

  # --- data.profile.* --------------------------------------------------------

  - event: profile_changed
    ind_topic: "mp/ind/data/profile_changed"
    payload: schemas/data/profile_changed_ind.json
    qos: 1
    retain: false
    description: "A profile was created, modified, or deleted."

  # --- data.serv.* -------------------------------------------------------------

  - event: serv_state
    ind_topic: "mp/ind/data/serv_state"
    payload: schemas/data/serv_state_ind.json
    qos: 1
    retain: false
    description: "Boot-time and on-change serving-system service state."

  - event: serv_roaming
    ind_topic: "mp/ind/data/serv_roaming"
    payload: schemas/data/serv_roaming_ind.json
    qos: 1
    retain: false
    description: "Boot-time and on-change roaming status."

  # --- data.subsys_ready — one retained topic per manager --------------------
  # The three managers (connection/profile/serving-system) map to three
  # independently-booting subsystems on real hardware -- each publishes its
  # own readiness the moment it's up, instead of collapsing into a single
  # domain-wide signal (see Topics.hpp's original comment on this decision).

  - event: subsys_ready_data
    ind_topic: "mp/ind/data/subsys_ready/data"
    payload: schemas/data/subsys_ready_ind.json
    qos: 1
    retain: true
    description: "DataConnectionManager subsystem readiness."

  - event: subsys_ready_profile
    ind_topic: "mp/ind/data/subsys_ready/profile"
    payload: schemas/data/subsys_ready_ind.json
    qos: 1
    retain: true
    description: "DataProfileManager subsystem readiness."

  - event: subsys_ready_serv
    ind_topic: "mp/ind/data/subsys_ready/serv"
    payload: schemas/data/subsys_ready_ind.json
    qos: 1
    retain: true
    description: "ServingSystemManager subsystem readiness."
