; Consolidated supervisord config for the sml simulation stack.
;
; Programs start in priority order (lower = earlier):
;   mosquitto (priority 10)  -> sml-mpss (priority 20)
;
; Strict event-based sequencing is NOT used because supervisord_dependent_startup
; has a race condition: it exits immediately if dependencies are already RUNNING
; when it initialises (states_reached is empty — event history, not current state).
; The Python code already handles out-of-order startup via paho reconnection and
; the _mpss_syncing HSM state, so priority ordering is sufficient.
;
; Control: supervisorctl -c /root/sml/supervisord.sml.conf <status|restart|stop>

[supervisord]
nodaemon = false
logfile  = /tmp/supervisord.sml.log
pidfile  = /tmp/supervisord.sml.pid
user     = root

[unix_http_server]
file = /tmp/supervisor.sml.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sml.sock

; -- mosquitto MQTT broker -----------------------------------------------------
[program:mosquitto]
command          = /usr/sbin/mosquitto -c /root/sml/mosquitto.conf
priority         = 10
autostart        = true
autorestart      = true
startretries     = 10
startsecs        = 2
redirect_stderr  = true
stdout_logfile   = /tmp/mosquitto.log

; -- sml/mpss -- MPSS Director --------------------------------------------------
[program:sml-mpss]
command          = python3 -m sml.mpss
directory        = /root
environment      = PYTHONPATH="/root:/root/sml"
priority         = 20
autostart        = true
autorestart      = true
startretries     = 10
startsecs        = 2
redirect_stderr  = true
stdout_logfile   = /tmp/sml_mpss.log
