#
# ctrl/cmd/action example: raw payload (no envelope), validated against
# scenario.seek.req before send. Jumps the timeline to a given time point.
# This is `kind: rpc` -- the response lands on ctrl/cmd/scenario/seek/rsp;
# run `sml mqttcli sub ctrl/cmd/scenario/#` in another terminal to see it,
# since `pub` never waits for a response.

topic: ctrl/cmd/scenario/seek
data:
  at: "10s"
