#
# Simulate LTE cell handover while voice and data registration stay in service.
# Usage: sml mqttcli pub sml/tools/mqttcli/commands/radio_scenario_lte_handover.yaml
interval: 500ms
messages:
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_LTE
      domain: CS_PS
      state: IN_SERVICE
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: REG_HOME
      denialCause: -1
      radioTech: RADIO_TECH_LTE
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: ACTIVE
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells:
        - cellType: LTE
          registered: true
          lte:
            mcc: "310"
            mnc: "01"
            ci: 78849
            pci: 411
            tac: 702
            earfcn: 400
            signalStrength: 26
            rsrp: -92
            rsrq: -11
            rssnr: 12
            cqi: 2147483647
            timingAdvance: 1
  - topic: ctrl/cmd/action/radio/force_rf_band_info
    data:
      band: E_UTRA_OPERATING_BAND_1
      channel: 400
      bandWidth: LTE_BW_NRB_100
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 26
        lteRsrp: -92
        lteRsrq: -11
        lteRssnr: 12
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells:
        - cellType: LTE
          registered: true
          lte:
            mcc: "310"
            mnc: "01"
            ci: 78850
            pci: 412
            tac: 702
            earfcn: 1575
            signalStrength: 30
            rsrp: -80
            rsrq: -9
            rssnr: 30
            cqi: 2147483647
            timingAdvance: 1
  - topic: ctrl/cmd/action/radio/force_rf_band_info
    data:
      band: E_UTRA_OPERATING_BAND_3
      channel: 1575
      bandWidth: LTE_BW_NRB_50
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 30
        lteRsrp: -80
        lteRsrq: -9
        lteRssnr: 30
