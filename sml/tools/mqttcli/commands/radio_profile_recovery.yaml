#
# Recover to a fixed healthy LTE fixture across radio, data, and IMS.
# Usage: sml mqttcli pub sml/tools/mqttcli/commands/radio_profile_recovery.yaml
interval: 100ms
messages:
  - topic: ctrl/cmd/action/radio/force_profile
    data:
      profile: recovery
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 31
        lteRsrp: -83
        lteRsrq: -10
        lteRssnr: 29
      nr5g:
        rsrp: 2147483647
        rsrq: 2147483647
        rssnr: 2147483647
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells:
        - cellType: LTE
          registered: true
          lte:
            mcc: "310"
            mnc: "01"
            ci: 78849
            pci: 411
            tac: 702
            earfcn: 400
            signalStrength: 31
            rsrp: -83
            rsrq: -10
            rssnr: 29
            cqi: 2147483647
            timingAdvance: 1
  - topic: ctrl/cmd/action/radio/force_rf_band_info
    data:
      band: E_UTRA_OPERATING_BAND_1
      channel: 400
      bandWidth: LTE_BW_NRB_100
  - topic: ctrl/cmd/action/radio/force_operator_info
    data:
      longName: Operator1
      shortName: Operator1
      plmn: "31001"
      isHome: true
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: REG_HOME
      denialCause: -1
      radioTech: RADIO_TECH_LTE
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_LTE
      domain: CS_PS
      state: IN_SERVICE
  - topic: ctrl/cmd/action/radio/force_dc_status
    data:
      endcAvailability: UNAVAILABLE
      dcnrRestriction: RESTRICTED
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: DORMANT
  - topic: ctrl/cmd/action/data/force_roaming
    data:
      isRoaming: false
      roamingType: DOMESTIC
  - topic: ctrl/cmd/action/data/force_nr_icon_type
    data:
      iconType: NONE
  - topic: ctrl/cmd/action/radio/force_ims_registration_info
    data:
      imsRegStatus: REGISTERED
      rat: RADIO_TECH_LTE
      errorCode: 0
      errorString: ""
  - topic: ctrl/cmd/action/radio/force_ims_service_info
    data:
      sms: FULL_SERVICE
      voice: FULL_SERVICE
  - topic: ctrl/cmd/action/radio/force_ims_pdp_status
    data:
      isPdpConnected: true
