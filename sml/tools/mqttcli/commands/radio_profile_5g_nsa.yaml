#
# Apply a complete 5G NSA fixture: LTE anchor, EN-DC available, NR icon set.
# Usage: sml mqttcli pub sml/tools/mqttcli/commands/radio_profile_5g_nsa.yaml
interval: 100ms
messages:
  - topic: ctrl/cmd/action/radio/force_profile
    data:
      profile: 5g-nsa
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 30
        lteRsrp: -86
        lteRsrq: -10
        lteRssnr: 80
      nr5g:
        rsrp: -90
        rsrq: -11
        rssnr: 100
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells:
        - cellType: LTE
          registered: true
          lte:
            mcc: "310"
            mnc: "01"
            ci: 78849
            pci: 411
            tac: 702
            earfcn: 400
            signalStrength: 30
            rsrp: -86
            rsrq: -10
            rssnr: 80
            cqi: 2147483647
            timingAdvance: 1
        - cellType: NR5G
          registered: false
          nr5g:
            mcc: "310"
            mnc: "01"
            ci: 2294161
            pci: 18
            tac: 702
            arfcn: 642000
            rsrp: -90
            rsrq: -11
            rssnr: 100
  - topic: ctrl/cmd/action/radio/force_rf_band_info
    data:
      band: E_UTRA_OPERATING_BAND_1
      channel: 400
      bandWidth: LTE_BW_NRB_100
  - topic: ctrl/cmd/action/radio/force_operator_info
    data:
      longName: Operator1
      shortName: Operator1
      plmn: "31001"
      isHome: true
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: REG_HOME
      denialCause: -1
      radioTech: RADIO_TECH_LTE
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_LTE
      domain: CS_PS
      state: IN_SERVICE
  - topic: ctrl/cmd/action/radio/force_dc_status
    data:
      endcAvailability: AVAILABLE
      dcnrRestriction: UNRESTRICTED
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: ACTIVE
  - topic: ctrl/cmd/action/data/force_roaming
    data:
      isRoaming: false
      roamingType: DOMESTIC
  - topic: ctrl/cmd/action/data/force_nr_icon_type
    data:
      iconType: UWB
  - topic: ctrl/cmd/action/radio/force_ims_registration_info
    data:
      imsRegStatus: REGISTERED
      rat: RADIO_TECH_LTE
      errorCode: 0
      errorString: ""
  - topic: ctrl/cmd/action/radio/force_ims_service_info
    data:
      sms: FULL_SERVICE
      voice: FULL_SERVICE
  - topic: ctrl/cmd/action/radio/force_ims_pdp_status
    data:
      isPdpConnected: true
