#
# Simulate a tunnel or underground drive: signal degrades, service is lost,
# then LTE service recovers to the fixed healthy fixture.
# Usage: sml mqttcli pub sml/tools/mqttcli/commands/radio_scenario_tunnel_loss_recovery.yaml
interval: 500ms
messages:
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_LTE
      domain: CS_PS
      state: IN_SERVICE
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: REG_HOME
      denialCause: -1
      radioTech: RADIO_TECH_LTE
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: ACTIVE
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 8
        lteRsrp: -112
        lteRsrq: -17
        lteRssnr: -12
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 2147483647
        lteRsrp: 2147483647
        lteRsrq: 2147483647
        lteRssnr: 2147483647
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells: []
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_UNKNOWN
      domain: NO_SRV
      state: NO_SERVICE
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: NOT_REG_AND_SEARCHING
      denialCause: -1
      radioTech: RADIO_TECH_UNKNOWN
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: OUT_OF_SERVICE
      drbStatus: DORMANT
  - topic: ctrl/cmd/action/radio/force_profile
    data:
      profile: recovery
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 31
        lteRsrp: -83
        lteRsrq: -10
        lteRssnr: 29
      nr5g:
        rsrp: 2147483647
        rsrq: 2147483647
        rssnr: 2147483647
  - topic: ctrl/cmd/action/radio/force_cell_info
    data:
      cells:
        - cellType: LTE
          registered: true
          lte:
            mcc: "310"
            mnc: "01"
            ci: 78849
            pci: 411
            tac: 702
            earfcn: 400
            signalStrength: 31
            rsrp: -83
            rsrq: -10
            rssnr: 29
            cqi: 2147483647
            timingAdvance: 1
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: DORMANT
