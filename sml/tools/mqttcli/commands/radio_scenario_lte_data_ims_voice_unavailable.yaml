#
# Simulate LTE packet data working while IMS voice service is unavailable.
# Usage: sml mqttcli pub sml/tools/mqttcli/commands/radio_scenario_lte_data_ims_voice_unavailable.yaml
interval: 100ms
messages:
  - topic: ctrl/cmd/action/radio/force_sys_info
    data:
      rat: RADIO_TECH_LTE
      domain: CS_PS
      state: IN_SERVICE
  - topic: ctrl/cmd/action/radio/force_voice_service_state
    data:
      voiceServiceState: REG_HOME
      denialCause: -1
      radioTech: RADIO_TECH_LTE
  - topic: ctrl/cmd/action/data/force_serv_state
    data:
      serviceState: IN_SERVICE
      networkRat: LTE
      drbStatus: ACTIVE
  - topic: ctrl/cmd/action/radio/force_signal_strength
    data:
      lte:
        lteSignalStrength: 29
        lteRsrp: -84
        lteRsrq: -9
        lteRssnr: 24
  - topic: ctrl/cmd/action/radio/force_ims_registration_info
    data:
      imsRegStatus: NOT_REGISTERED
      rat: RADIO_TECH_LTE
      errorCode: 503
      errorString: ims voice unavailable
  - topic: ctrl/cmd/action/radio/force_ims_service_info
    data:
      sms: LIMITED_SERVICE
      voice: NO_SERVICE
  - topic: ctrl/cmd/action/radio/force_ims_pdp_status
    data:
      isPdpConnected: false
      failureCode: CONNECTION_BRINGUP_FAILURE
      failureReasonType: CE_INTERNAL
      failureReasonCode: 503
