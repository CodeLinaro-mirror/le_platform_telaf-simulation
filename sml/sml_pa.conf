#
# sml_pa.conf -- runtime knobs for the simulation PA layer (the C++ side that
# lives in the telaf-services process: pa/telaf-pa-simula/).
#
# WHY THIS FILE EXISTS
# --------------------
# Every setting here is also readable from an environment variable, and the env
# var always WINS when both are set. But the PA layer is loaded into a process
# started by the Legato/supervisor supervisor, which does not forward an
# interactive shell's exports -- so `export SML_PA_LOG_LEVEL=DEBUG` in your
# shell has no effect on the running stack. This file is the supervisor-proof
# channel for the same knobs.
#
# DEPLOYMENT
# ----------
# The PA reads the ABSOLUTE path /etc/sml_pa.conf (hardcoded in
# component/common/Log.cpp's kConfPath and passed to chart::init_from_env).
# This copy is the source of truth and lives in the volume-mounted sml/ tree so
# it can be edited without rebuilding the image; workstation/.simula.once.sh
# installs it to /etc/sml_pa.conf at container start.
#
# Read ONCE at process start and cached -- NOT hot-reloaded. After editing,
# restart the stack (`telaf stop && telaf start`) for changes to take effect.
# A missing file is not an error: every key falls back to the default below.
#
# FORMAT
# ------
# KEY=VALUE, one per line. '#' starts a comment. Surrounding whitespace on both
# key and value is trimmed. Unknown keys are ignored.

# --- PA log verbosity --------------------------------------------------------
# LOG_LEVEL: DEBUG | INFO | WARN | ERROR      (env: SML_PA_LOG_LEVEL)
# Gates the LOG_DEBUG/LOG_INFO/LOG_WARN/LOG_ERROR macros. Anything below the
# level is discarded at the call site. Default: INFO.
LOG_LEVEL=INFO

# --- PA log file sink --------------------------------------------------------
# LOG_FILE: absolute path, or empty/absent to disable  (env: SML_PA_LOG_FILE)
# syslog is ALWAYS the primary sink (visible via `logread`); this is an
# additional append-mode file sink, opened once at process start. It also
# captures the chart::Spy trace/spy lines below, which is the main reason to
# enable it -- state-machine traces are far easier to read in one file than
# interleaved into syslog.
#
# Left empty by default: enabling it writes unbounded output with no rotation.
# Point it at a tmpfs path (/tmp/...) rather than a persistent volume so a long
# soak cannot fill the disk.
LOG_FILE=

# --- State-machine instrumentation (chart::Spy) ------------------------------
# LOG_SPY: off | on | verbose                 (env: TELAF_CHART_SPY)
# Instrumentation for the C++ HSMs in the PA layer (ModemBridge,
# ListenerDispatchAO, the data-domain managers, and the sim-domain
# CardManager/SubscriptionManager/MultiSimManager). Resolved once at startup by
# chart::init_from_env; NOT switchable at runtime.
#
#   off     -- nothing recorded. Default; zero overhead (a null Instrument
#              pointer short-circuits before any string work).
#   on      -- transitions only, tagged [sml-pa trace] in syslog:
#                [  12.345] [CardManager] e->ReadinessEvt_Signal() \
#                    CardManager::NotReady->CardManager::Ready
#              This is the "what changed" view and the right default when
#              investigating a stuck/incorrect SIM state.
#   verbose -- adds one line per handler visit plus HOOK / IGNORED lines,
#              tagged [sml-pa spy]. Very chatty (every dispatch on every AO);
#              use only for a focused reproduction, and pair it with LOG_FILE.
#
# The MPSS (Python) side has its own equivalent knob -- see
# sml/mpss/config.yaml's debug.instrumentation. The two are deliberately
# independent: this one traces the PA/SDK side, that one traces the simulator.
LOG_SPY=off
